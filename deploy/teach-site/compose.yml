# 教程站静态容器。服务器路径:/opt/prismice/teach
# 只接入 prismice_app-network,不对外开放端口;公网 HTTPS 由主站网关 prismice-caddy-1 转发。
name: prismice-teach

services:
  teach:
    image: caddy:2.11.4-alpine
    container_name: prismice-teach
    restart: unless-stopped
    volumes:
      - ./site:/srv:ro
      - ./conf:/etc/caddy:ro   # 挂整个文件夹:改配置后文件被替换也能读到新内容
    networks:
      - prismice_app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  prismice_app-network:
    external: true
